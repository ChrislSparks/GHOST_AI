# Docs and markdown changes (README, docs folder)
documentation:
- changed-files:
  - any-glob-to-any-file:
    - 'docs/**'
    - '**/*.md'

# Python backend changes
backend:
- changed-files:
  - any-glob-to-any-file: 'backend/**'

# Web frontend changes
frontend:
- changed-files:
  - any-glob-to-any-file: 'frontend/**'

# Test changes
tests:
- changed-files:
  - any-glob-to-any-file:
    - 'tests/**'
    - 'pytest.ini'

# GitHub Actions / repo config changes
ci:
- changed-files:
  - any-glob-to-any-file: '.github/**'

# New features: PRs from branches named feature/...
enhancement:
- head-branch: ['^feature']
