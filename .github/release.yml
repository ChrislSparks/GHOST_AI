# .github/release.yml

changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking Changes 🛠
      labels:
        - Semver-Major
        - breaking-change
    - title: New Features 🎉
      labels:
        - Semver-Minor
        - enhancement
    - title: Bug Fixes 🐛
      labels:
        - bug
    - title: Backend ⚙️
      labels:
        - backend
    - title: Frontend 🖥️
      labels:
        - frontend
    - title: Documentation 📝
      labels:
        - documentation
    - title: Tests ✅
      labels:
        - tests
    - title: CI / Config 🔧
      labels:
        - ci
    - title: Other Changes
      labels:
        - "*"
